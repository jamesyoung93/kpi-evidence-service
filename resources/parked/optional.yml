parked_variables:
  target: "databricks.yml: variables"
  how: merge into the mapping
  content:
    app_name:
      description: Databricks App name (lowercase letters, digits, hyphens; unique per workspace; fixed at creation).
      default: kpi-evidence-review
    reviewer_group:
      description: Reviewers (dashboard, review datasets). Members should also be in consumer_group to open the app.
      default: kpi-reviewers
    consumer_group:
      description: Consumers of published values (app CAN_USE, Genie CAN_RUN, SELECT on the Genie tables).
      default: kpi-consumers
    genie_title:
      description: Title of the Genie agent (formerly "Genie space") over the published values.
      default: KPI Evidence - published values
    genie_description:
      default: Ask about reviewer-approved KPI values from brand reports, with their validation status and evidence.

parked_dev_variables:
  target: "databricks.yml: targets.dev.variables"
  how: merge into the mapping
  content:
    app_name: kpi-evidence-review-dev
    reviewer_group: users
    consumer_group: users

check_wheel_variant:
  target: "resources/jobs.yml: resources.jobs.kpi_check"
  how: merge into the mapping
  content:
    environments:
      - environment_key: default
        spec:
          environment_version: "5"
          dependencies:
            - ../libs/reconloop/dist/*.whl
            - ../dist/*.whl
    tasks:
      - task_key: check
        environment_key: default
        max_retries: 0
        timeout_seconds: 3600
        python_wheel_task:
          package_name: kpi_evidence
          entry_point: kpi-evidence-check
          named_parameters:
            reports: "{{job.parameters.reports}}"
            kpis: "{{job.parameters.kpis}}"
            out_dir: "{{job.parameters.out_dir}}"
            catalog: "{{job.parameters.catalog}}"
            gov_schema: "{{job.parameters.gov_schema}}"
            brand: "{{job.parameters.brand}}"
            ai_mode: "{{job.parameters.ai_mode}}"
            run_id: "{{job.run_id}}"

parked_bootstrap_parameters:
  target: "resources/jobs.yml: resources.jobs.kpi_bootstrap.tasks[task_key=bootstrap].python_wheel_task.named_parameters"
  how: merge into the mapping
  content:
    app_sp: ${resources.apps.kpi_review.service_principal_client_id}
    admin_group: ${var.admin_group}
    reviewer_group: ${var.reviewer_group}
    consumer_group: ${var.consumer_group}
    genie_space_id: ${resources.genie_spaces.kpi_published.id}

file_arrival_trigger:
  target: "resources/jobs.yml: resources.jobs.kpi_pipeline"
  how: merge into the mapping
  content:
    trigger:
      pause_status: UNPAUSED
      file_arrival:
        url: /Volumes/${var.catalog}/${resources.schemas.kpi_evidence.name}/${resources.volumes.reports.name}/inbox/
        min_time_between_triggers_seconds: 60
        wait_after_last_change_seconds: 120

parked_publication_tasks:
  target: "resources/jobs.yml: resources.jobs.kpi_pipeline.tasks"
  how: append to the list
  content:
    - task_key: publish
      depends_on:
        - task_key: process
      environment_key: default
      max_retries: 0
      disable_auto_optimization: true
      timeout_seconds: 900
      python_wheel_task:
        package_name: kpi_evidence
        entry_point: kpi-evidence-publish
        named_parameters:
          backend: databricks
          catalog: "{{job.parameters.catalog}}"
          schema: "{{job.parameters.schema}}"
          gov_schema: "{{job.parameters.gov_schema}}"
          volume_path: "{{job.parameters.volume_path}}"
          ai_mode: "{{job.parameters.ai_mode}}"
          ai_model: "{{job.parameters.ai_model}}"
          run_id: "{{job.run_id}}"
    - task_key: refresh_dashboard
      depends_on:
        - task_key: publish
      run_if: ALL_DONE
      max_retries: 1
      min_retry_interval_millis: 60000
      timeout_seconds: 600
      dashboard_task:
        dashboard_id: ${resources.dashboards.kpi_coverage.id}
        warehouse_id: ${var.warehouse_id}
