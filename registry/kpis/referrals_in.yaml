kpi_id: referrals_in
version: 1
status: APPROVED
label: Incoming referrals (observed)
definition: >-
  Referrals received by brand HCPs in the period, as observed in the referral feed (covers about 80%
  of eligible HCPs). Not projected: an uncovered HCP is unknown, not zero.
unit: count
aggregation: sum
grains: [month, quarter, r3m, r6m, r12m, ytd]
dimensions: [region, district, territory, specialty, payer_channel]
synonyms: ["referrals", "incoming referrals", "referrals in", "referrals received", "patient referrals"]
mapping_description: Number of patient referrals received by the brand's HCPs.
claim_class: descriptive
owner: brand-analytics@example.com
approved_by: kpi-registry-owner@example.com
approved_at: 2026-10-19
tolerance: {rel: 0.005, abs: 0.0, use_display_rounding: true}
harness_link: {metric_id: referrals_in, variant_id: observed, source: referral}
platform:
  source_views: [gv_referrals_monthly]
  template: |-
    SELECT {projection} AS value
    FROM ${gov}.gv_referrals_monthly
    WHERE brand = ${brand} AND ${window} AND ${scope}
  params:
    projection:
      hypothesis: universe
      default: observed
      options: {observed: "SUM(referrals_in)", projected: "SUM(referrals_in) / 0.8"}
      describe: {observed: "Observed referrals only", projected: "Observed referrals scaled to full HCP coverage (/0.80)"}
      keywords: {projected: ["projected", "extrapolated", "estimated total"]}
      permitted: [observed]
  checks:
    period_has_rows: "SELECT CASE WHEN COUNT(*) > 0 THEN 0 ELSE 1 END AS value FROM ${gov}.gv_referrals_monthly WHERE ${window}"
