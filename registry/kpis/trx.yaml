kpi_id: trx
version: 1
status: APPROVED
label: Total prescriptions (TRx)
definition: >-
  Total prescription units for the brand in the period, from the account-level prescription feed
  (system of record), summed across all payer channels.
unit: count
aggregation: sum
grains: [month, quarter, r3m, r6m, r12m, ytd]
dimensions: [region, district, territory, specialty, payer_channel]
synonyms: ["trx", "total rx", "total prescriptions", "total scripts", "trx units", "total trx", "prescriptions"]
mapping_description: Total prescriptions (all fills, new and refill) for the brand, in units.
claim_class: descriptive
owner: brand-analytics@example.com
approved_by: kpi-registry-owner@example.com
approved_at: 2026-10-19
tolerance: {rel: 0.005, abs: 0.0, use_display_rounding: true}
harness_link: {metric_id: trx, variant_id: units, source: source_a}
platform:
  source_views: [gv_rx_account_monthly, gv_rx_panel_monthly]
  template: |-
    SELECT SUM({measure}) AS value
    FROM {source}
    WHERE brand = ${brand} AND ${window} AND ${scope}
  params:
    measure:
      hypothesis: measure
      default: units
      options: {units: trx_units, normalized: trx_normalized}
      describe: {units: "Prescription units as dispensed", normalized: "Payer-normalized prescription units"}
      keywords: {normalized: ["normalized", "payer-normalized", "payer normalized"]}
      permitted: [units, normalized]
    source:
      hypothesis: source
      default: account_feed
      options: {account_feed: "${gov}.gv_rx_account_monthly", panel: "${gov}.gv_rx_panel_monthly"}
      describe: {account_feed: "Account-level direct + specialty pharmacy feed (no lag)", panel: "Projected retail panel (one-month lag, regional projection factors)"}
      keywords: {panel: ["panel", "projected", "retail panel"]}
      permitted: [account_feed]
  checks:
    period_has_rows: "SELECT CASE WHEN COUNT(*) > 0 THEN 0 ELSE 1 END AS value FROM {source} WHERE ${window}"
